name: Acquire NSE PIT Fundamentals

on:
  workflow_dispatch:
  schedule:
    - cron: "19 */2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/acquire_nse_pit_fundamentals.py"
      - "scripts/augment_nse_integrated_filing_facts.py"
      - "data/nifty500_official_history.csv"
      - ".github/workflows/acquire_nse_pit_fundamentals.yml"

permissions:
  contents: write

concurrency:
  group: nse-pit-fundamentals
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Acquire legacy NSE filings and XBRL facts
        continue-on-error: true
        run: |
          python scripts/acquire_nse_pit_fundamentals.py \
            --output data/nse_pit_fundamentals_legacy.csv \
            --manifest data/nse_pit_fundamentals_legacy_manifest.json \
            --max-workers 1
      - name: Acquire NSE Integrated Filing XBRL facts
        continue-on-error: true
        run: |
          PYTHONPATH=scripts python scripts/augment_nse_integrated_filing_facts.py \
            --output data/nse_pit_fundamentals_integrated.csv \
            --manifest data/nse_pit_fundamentals_integrated_manifest.json \
            --max-workers 1
      - name: Merge and validate acquired evidence
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          expected = 501
          legacy = Path('data/nse_pit_fundamentals_legacy.csv')
          integrated = Path('data/nse_pit_fundamentals_integrated.csv')
          out = Path('data/nse_pit_fundamentals.csv')
          rows = []
          for p in (legacy, integrated):
              if p.exists() and p.stat().st_size:
                  with p.open(encoding='utf-8', newline='') as f:
                      rows.extend(csv.DictReader(f))
          if not rows:
              raise SystemExit('No NSE filing evidence was acquired')
          fields = list(rows[0].keys())
          with out.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(rows)
          lm = json.loads(Path('data/nse_pit_fundamentals_legacy_manifest.json').read_text()) if Path('data/nse_pit_fundamentals_legacy_manifest.json').exists() else {}
          im = json.loads(Path('data/nse_pit_fundamentals_integrated_manifest.json').read_text()) if Path('data/nse_pit_fundamentals_integrated_manifest.json').exists() else {}
          numeric_symbols = {
              r.get('symbol') for r in rows
              if r.get('xbrl_parse_status') == 'parsed'
              and r.get('metric_name') != '__FILING_CATALOG__'
              and r.get('symbol')
          }
          legacy_ok = (
              lm.get('status') == 'complete'
              and lm.get('symbols_processed') == expected
              and not lm.get('errors')
          )
          integrated_ok = (
              im.get('status') == 'complete'
              and im.get('symbols_processed') == expected
              and not im.get('errors')
          )
          manifest = {
              'status': 'complete' if legacy_ok and integrated_ok and numeric_symbols else 'blocked',
              'source': 'NSE India Financial Results + Integrated Filing + linked NSE XBRL/iXBRL',
              'nifty500_source_url': 'https://www.niftyindices.com/IndexConstituent/ind_nifty500list.csv',
              'symbols_expected': expected,
              'symbols_processed': min(lm.get('symbols_processed', 0), im.get('symbols_processed', 0)),
              'records': len(rows),
              'symbols_with_xbrl_numeric_facts': len(numeric_symbols),
              'legacy_manifest': lm,
              'integrated_manifest': im,
              'errors': {
                  'legacy': lm.get('errors') or [],
                  'integrated': im.get('errors') or {},
              },
              'policy': 'Missing publication evidence or unavailable filings remain BLOCKED; no synthetic values are permitted.'
          }
          Path('data/nse_pit_fundamentals_manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          if manifest['status'] != 'complete':
              raise SystemExit('NSE PIT acquisition remains BLOCKED')
          PY
      - name: Commit acquired evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/nse_pit_fundamentals.csv data/nse_pit_fundamentals_manifest.json
          if git diff --cached --quiet; then
            echo "No evidence changes"
          else
            git commit -m "Acquire NSE PIT fundamentals evidence"
            git push
          fi
