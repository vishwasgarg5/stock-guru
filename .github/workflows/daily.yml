name: Daily Stock Guru

on:
  schedule:
    - cron: "30 18 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - name: Restore latest promoted model
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous retrained artifacts
          RETRAIN_RUN_ID=$(gh run list --workflow retrain.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "${RETRAIN_RUN_ID}" ]; then
            gh run download "${RETRAIN_RUN_ID}" --name "stock-guru-retrain-${RETRAIN_RUN_ID}" --dir retrained
            for f in ranker.joblib ohlc.joblib features.csv walk_forward_metrics.json model_metadata.json; do
              src=$(find retrained -name "$f" -type f -print -quit 2>/dev/null || true)
              if [ -n "$src" ]; then cp "$src" "artifacts/$f"; fi
            done
          fi

      - name: Restore previous daily artifact
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow daily.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "${RUN_ID}" ]; then
            echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
            gh run download "${RUN_ID}" --name "stock-guru-daily-${RUN_ID}" --dir previous
          else
            echo "No previous successful daily artifact found."
          fi

      - name: Refresh market data
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from stock_guru.data import download_nifty500_prices
          download_nifty500_prices(start="2018-01-01", output="data/prices.csv")
          PY

      - name: Restore previous model if no promoted model exists
        shell: bash
        run: |
          for f in ranker.joblib ohlc.joblib features.csv model_metadata.json; do
            if [ ! -f "artifacts/$f" ]; then
              src=$(find previous -name "$f" -type f -print -quit 2>/dev/null || true)
              if [ -n "$src" ]; then cp "$src" "artifacts/$f"; fi
            fi
          done

      - name: Restore cumulative feedback history
        shell: bash
        run: |
          src=$(find previous -name feedback.csv -type f -print -quit 2>/dev/null || true)
          if [ -n "$src" ]; then cp "$src" artifacts/feedback.csv; fi

      - name: Evaluate previous predictions
        if: steps.previous.outputs.run_id != ''
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          PRED=$(find previous -name daily_predictions.csv -type f -print -quit)
          if [ -n "${PRED}" ]; then
            python -m stock_guru.cli feedback \
              --prices data/prices.csv \
              --predictions "${PRED}" \
              --output artifacts/feedback.csv \
              --metrics-output artifacts/feedback_metrics.json
          else
            echo "Previous prediction file not found; skipping feedback."
          fi

      - name: Run daily prediction
        env:
          PYTHONPATH: src
        run: |
          python scripts/daily_pipeline.py \
            --prices data/prices.csv \
            --model-dir artifacts \
            --output artifacts/daily_predictions.csv

      - name: Upload daily outputs
        uses: actions/upload-artifact@v4
        with:
          name: stock-guru-daily-${{ github.run_number }}
          path: |
            artifacts/daily_predictions.csv
            artifacts/feedback.csv
            artifacts/feedback_metrics.json
            artifacts/ranker.joblib
            artifacts/ohlc.joblib
            artifacts/features.csv
            artifacts/model_metadata.json
            artifacts/walk_forward_metrics.json
            data/nifty500_universe.csv
            data/universe_snapshots.csv
          if-no-files-found: error
