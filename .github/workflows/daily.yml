name: Daily Stock Guru

on:
  schedule:
    - cron: "30 18 * * 1-5"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run daily prediction
        env:
          PYTHONPATH: src
        run: |
          python scripts/daily_pipeline.py \
            --prices data/prices.csv \
            --model-dir artifacts \
            --output artifacts/daily_predictions.csv
      - name: Upload daily outputs
        uses: actions/upload-artifact@v4
        with:
          name: stock-guru-daily-${{ github.run_number }}
          path: |
            artifacts/daily_predictions.csv
            artifacts/ranker.joblib
            artifacts/ohlc.joblib
            artifacts/features.csv
            data/nifty500_universe.csv
            data/universe_snapshots.csv
          if-no-files-found: error
